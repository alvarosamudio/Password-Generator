<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b4dff"/>
      <stop offset="100%" stop-color="#3a1c9c"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#f2a516"/>
    </linearGradient>
    <linearGradient id="arco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f2fb"/>
      <stop offset="100%" stop-color="#c7c1dc"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#160a40" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>

  <!-- Candado -->
  <g filter="url(#sh)">
    <path d="M 40 60 V 46 A 22 22 0 0 1 84 46 V 60" fill="none" stroke="url(#arco)" stroke-width="10" stroke-linecap="round"/>
    <rect x="24" y="56" width="76" height="52" rx="12" fill="url(#oro)"/>
  </g>
  <!-- Contrasena generada: asteriscos en una franja -->
  <rect x="32" y="72" width="60" height="20" rx="10" fill="#3a1c9c" opacity="0.9"/>
  <g fill="#ffffff">
    <circle cx="44" cy="82" r="4.2"/>
    <circle cx="56" cy="82" r="4.2"/>
    <circle cx="68" cy="82" r="4.2"/>
    <circle cx="80" cy="82" r="4.2"/>
  </g>

  <!-- Destello de "generar" -->
  <path d="M 100 14 Q 102.5 25.5 114 28 Q 102.5 30.5 100 42 Q 97.5 30.5 86 28 Q 97.5 25.5 100 14 Z" fill="#ffffff"/>
  <path d="M 108 44 Q 109 48 113 49 Q 109 50 108 54 Q 107 50 103 49 Q 107 48 108 44 Z" fill="#ffffff" opacity="0.8"/>
</svg>
